target-version = "py313"

# core/ is vendored (scripts/pull_core.py); bench data is task and review input, not code.
extend-exclude = ["core", "bench/review-samples", "bench/tasks"]

[lint]
select = ["E4", "E7", "E9", "F", "RUF100", "B"]
ignore = ["E741"]
# Reasons for these markers live in the code; RUF100 must not treat them as unused.
external = ["BLE001", "S310"]
