# pi-foreman sidebar: Agents panel rows for pi panes.
#
# Merge this block into your Herdr config.toml (keep ONE
# [ui.sidebar.agents.rows_by_agent] table; if you already have one, add the
# `pi = [...]` entry to it), then run `herdr server reload-config`.
# Only `pi` panes use these rows; other agents keep your default rows.
#
# Five rows per session, one token each, so no Herdr separator (" · ") is drawn
# and the plugin owns every column of the line:
#   $fm_hd    tree connector, state glyph, label, age (the glyph animates in a live session)
#   $fm_a1    agents: running child runs, runs that just finished
#   $fm_a2    tasks and watches: PR watches, CI, background commands
#   $fm_a3    waits and an open ask
#   $fm_meta  tokens, cost, finished runs
# A row without a value is not drawn, so an idle session is one or two lines.
# The older tokens ($fm_sym, $fm_l1, $fm_l2, $fm_l3, $fm_cost) are still published
# for rows of your own, but this snippet no longer uses them.
#
# Colours: the detail rows are dim and follow your theme. The header rules below
# colour the whole header line by the glyph it contains (rules match substrings
# of the value), for the unicode, emoji and nerd sets at once; the ascii set has
# no rules, its glyphs would collide with label text. A "!" or a state glyph in
# a session label colours its line too. "!" after the age marks a session
# blocked for more than 15 minutes, so that rule comes first. First match wins.
# The hex values are placeholders: pick the ones that suit your theme.
# The plugin draws the tree itself (the connectors and the blank cells U+2800
# that keep Herdr from trimming them), so do not put a state_icon or other cell
# in front of $fm_hd. Herdr 0.9.3 draws every row after the first 2 cells to the
# right; $fm_hd starts with 2 blank cells so the tree lines still meet.

[ui.sidebar.agents.rows_by_agent]
pi = [
  [{ token = "$fm_hd", rules = [
      { contains = "!", fg = "#d9534f", bold = true },
      { contains = "✋", fg = "#e0a030" },
      { contains = "\uf256", fg = "#e0a030" },
      { contains = "?", fg = "#e0a030" },
      { contains = "❓", fg = "#e0a030" },
      { contains = "\uf128", fg = "#e0a030" },
      { contains = "✗", fg = "#d9534f" },
      { contains = "❌", fg = "#d9534f" },
      { contains = "\uf00d", fg = "#d9534f" },
      { contains = "✓", fg = "#8a8a8a" },
      { contains = "✅", fg = "#8a8a8a" },
      { contains = "\uf00c", fg = "#8a8a8a" },
  ] }],
  [{ token = "$fm_a1", dim = true }],
  [{ token = "$fm_a2", dim = true }],
  [{ token = "$fm_a3", dim = true }],
  [{ token = "$fm_meta", dim = true }],
]
