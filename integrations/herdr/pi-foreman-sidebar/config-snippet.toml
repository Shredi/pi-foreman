# pi-foreman sidebar: Agents panel rows for pi panes.
#
# Merge this block into your Herdr config.toml (keep ONE
# [ui.sidebar.agents.rows_by_agent] table; if you already have one, add the
# `pi = [...]` entry to it), then run `herdr server reload-config`.
# Only `pi` panes use these rows; other agents keep your default rows.
#
# Colours are neutral placeholders: pick the ones that suit your theme.
# Row 1 opens with Herdr's built-in state_icon cell (a plain string, no `$`):
# Herdr draws working/idle/blocked itself, so no spinner is pushed any more
# (ui.spinner is deprecated and ignored). $fm_sym stays for what Herdr cannot
# know: "!" for a session blocked for more than 15 minutes, and the done mark
# of a finished session (the state_icon of a pi pane only ever shows
# working/unknown). The cell is empty otherwise. Rules test the cell's own
# value; the first match wins, so the "!" rule comes first.
# Glyphs: unicode set as characters, nerd set as \u escapes (ui.symbols).
# Nested sessions carry their tree prefix (├─ / └─) at the start of $fm_l1.
# Width: state_icon costs 2 columns (the plugin reserves them). Each cell you
# add before $fm_sym (an icon token, say) costs its width plus Herdr's " · "
# separator; set HERDR_SIDEBAR_LEAD (or --lead-cells) to the number you add.

[ui.sidebar.agents.rows_by_agent]
pi = [
  ["state_icon", { token = "$fm_sym", fg = "#5b8def", rules = [
      { contains = "!", fg = "#d9534f", bold = true },
      { equals = "✓", fg = "#5b8def" },
      { equals = "\uf00c", fg = "#5b8def" },
  ] }, "$fm_l1"],
  [{ token = "$fm_l2", dim = true }],
  [{ token = "$fm_l3", dim = true }, { token = "$fm_cost", fg = "#5b8def" }],
]
