# pi-foreman sidebar: Agents panel rows for pi panes.
#
# Merge this block into your Herdr config.toml (keep ONE
# [ui.sidebar.agents.rows_by_agent] table; if you already have one, add the
# `pi = [...]` entry to it), then run `herdr server reload-config`.
# Only `pi` panes use these rows; other agents keep your default rows.
#
# Six rows per session. Five hold one token each, so no Herdr separator (" · ")
# is drawn and the plugin owns every column of the line; the pr row holds four
# cells, one per dot, so each dot gets its own colour:
#   $fm_hd    tree connector, state glyph, label, age (the glyph animates in a live session)
#   $fm_a1    agents: running child runs, runs that just finished
#   $fm_a2    tasks and watches: PR watches, CI, background commands
#   $fm_a3    waits and an open ask
#   $fm_pr1..4  PR status dots: a circle and the PR number, red / yellow / green / unknown
#   $fm_meta  tokens, cost, finished runs
# A row without a value is not drawn, so an idle session is one or two lines.
# The older tokens ($fm_sym, $fm_l1, $fm_l2, $fm_l3, $fm_cost) are no longer published.
#
# Glyph set of this snippet: unicode.
# Herdr takes at most 16 rules per token, so a
# snippet is written for ONE glyph set: `python3 sidebar.py configure [--symbols
# <set>]` prints it for unicode, emoji, nerd or ascii (default: your ui.symbols).
# Rerun it and merge again after you change ui.symbols.
#
# Colours: the detail rows are dim and follow your theme. The header cell has a
# base colour (green: a session working on its own turn); its rules colour the
# whole header line by the reason icon or state glyph it contains (rules match
# substrings of the value): blocked and ask yellow, review and agent blue, task
# and wait cyan, lost red, done and idle grey. The ascii set has no rules and no
# base colour, its glyphs would collide with label text. A "!" or a reason or
# state glyph in a session label colours its line too. "!" after the age marks a
# session blocked for more than 15 minutes, so that rule comes first. First
# match wins. If your Herdr rejects the cell-level `fg`, delete it: the own-turn
# line then keeps your theme colour and the rules still apply.
# The pr cells are coloured by their circle; the emoji set uses the same text
# circles, so the same rules colour it, and the ascii set has none. The unknown circle has no rule: it keeps your theme
# colour.
# The hex values are placeholders: pick the ones that suit your theme.
# The plugin draws the tree itself (the connectors and the blank cells U+2800
# that keep Herdr from trimming them), so do not put a state_icon or other cell
# in front of $fm_hd. Herdr 0.9.3 draws every row after the first 2 cells to the
# right; $fm_hd starts with 2 blank cells so the tree lines still meet.
#
# `python3 sidebar.py sample` shows a synthetic session in every state on one
# pane, so you can judge these rules live (docs/herdr.md, "Hand smoke").

[ui.sidebar.agents.rows_by_agent]
pi = [
  [{ token = "$fm_hd", fg = "#5cb85c", rules = [
      { contains = "!", fg = "#d9534f", bold = true },
      { contains = "✋", fg = "#e0a030" },
      { contains = "?", fg = "#e0a030" },
      { contains = "◎", fg = "#6fa8dc" },
      { contains = "◆", fg = "#6fa8dc" },
      { contains = "⚙", fg = "#5bc0de" },
      { contains = "◷", fg = "#5bc0de" },
      { contains = "✗", fg = "#d9534f" },
      { contains = "✓", fg = "#8a8a8a" },
      { contains = "⏸", fg = "#8a8a8a" },
  ] }],
  # Optional: colours the agents row while child runs are live; strike it to keep the row plain.
  [{ token = "$fm_a1", dim = true, rules = [
      { contains = "◆", fg = "#6fa8dc" },
  ] }],
  [{ token = "$fm_a2", dim = true }],
  # Optional: colours the waits row yellow while an ask is open; strike it to keep the row plain.
  [{ token = "$fm_a3", dim = true, rules = [
      { contains = "? ask ", fg = "#e0a030" },
  ] }],
  [{ token = "$fm_pr1", rules = [
      { contains = "●", fg = "#d9534f" },
      { contains = "◉", fg = "#e0a030" },
      { contains = "○", fg = "#5cb85c" },
  ] },
  { token = "$fm_pr2", rules = [
      { contains = "●", fg = "#d9534f" },
      { contains = "◉", fg = "#e0a030" },
      { contains = "○", fg = "#5cb85c" },
  ] },
  { token = "$fm_pr3", rules = [
      { contains = "●", fg = "#d9534f" },
      { contains = "◉", fg = "#e0a030" },
      { contains = "○", fg = "#5cb85c" },
  ] },
  { token = "$fm_pr4", rules = [
      { contains = "●", fg = "#d9534f" },
      { contains = "◉", fg = "#e0a030" },
      { contains = "○", fg = "#5cb85c" },
  ] }],
  # Optional: colours the meta row yellow while the host is under pressure; strike it to keep the row plain.
  [{ token = "$fm_meta", dim = true, rules = [
      { contains = "⚠", fg = "#e0a030" },
  ] }],
]

# Attention highlight. Herdr marks an agent that needs you from its agent status; pi-foreman raises
# that status (herdr:blocked) whenever a session shows ✋ or ?, so there is no switch to turn on.
# These Herdr keys (see `herdr --default-config`) only change how the attention shows. They stay
# comments: the plugin never writes your config.toml. Uncomment what you want, then reload.
# [ui]
# agent_panel_sort = "priority"        # "spaces" (default) groups by space; "priority" is the attention queue
# [ui.sound]
# request_path = "sounds/request.mp3"  # sound for needs-attention (a blocked session); path / done_path cover the rest
