name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: "22"}
          - {os: macos-latest, node: "22"}
          - {os: ubuntu-latest, node: "26"}
    name: test (${{ matrix.os }}${{ matrix.node != '22' && format(', node {0}', matrix.node) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      # full history: the sizing test reads the base commit's foreman.md
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: install bundled packages (pi-subagents, intercom)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: python unit tests
        run: python -m unittest discover -s tests -v
      - name: core pin check
        run: python scripts/pull_core.py --check
      # one leg is enough: ruff is pinned, so every leg would report the same findings
      - name: python lint (ruff)
        if: runner.os == 'Linux' && matrix.node == '22'
        run: |
          python -m pip install -q -r .github/lint-requirements.txt
          ruff --version
          ruff check .
      - name: typescript lint (oxlint)
        if: runner.os == 'Linux' && matrix.node == '22'
        run: npm run lint:ts
      # The spawn guard (no npm, no titled node process; scripts/foreman_test_run.mjs) matters on macOS, so only the macOS leg runs it.
      - name: node tests under the spawn guard (adapter and herdr-app mods)
        if: runner.os == 'macOS'
        run: npm run test:node
      - name: adapter tests
        if: runner.os != 'macOS'
        run: node --import ./extensions/core-adapter/test/_hermetic-env.mjs --test "extensions/core-adapter/test/*.test.ts"
      - name: herdr-app mod model tests
        if: runner.os != 'macOS'
        run: node --test "integrations/herdr-app/pi-foreman/*.test.mjs" "integrations/herdr-app/pi-foreman-plan/*.test.mjs"
      - name: installer tests (dry-run, idempotent second run, remove)
        run: node --import ./tests/installer/_hermetic-env.mjs --test "tests/installer/*.test.mjs"
      - name: typescript type check (extensions, Pi 1.7.0 types)
        if: runner.os == 'Linux'
        run: npx tsc --noEmit -p tsconfig.json
  test-windows:
    # The Windows leg is three shards that run at once. Shard 1/3 runs the python, herdr, installer and shim steps; the adapter tests are split over shards 2/3 and 3/3 with node's --test-shard (deterministic, by file order).
    # Measured over two runs: shard 1/3 13 to 16 min, 2/3 18 to 20 min, 3/3 15 to 24 min; the limit is about twice the slowest shard.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: "1/3"}
          - {shard: "2/3", adapter-shard: "1/2"}
          - {shard: "3/3", adapter-shard: "2/2"}
    name: test (windows-latest, ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: "Windows: Defender real-time scanning off (CI speed)"
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      # full history: the sizing test reads the base commit's foreman.md
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: install bundled packages (pi-subagents, intercom)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: python unit tests
        if: matrix.shard == '1/3'
        run: python -m unittest discover -s tests -v
      - name: core pin check
        if: matrix.shard == '1/3'
        run: python scripts/pull_core.py --check
      - name: herdr-app mod model tests
        if: matrix.shard == '1/3'
        run: node --test "integrations/herdr-app/pi-foreman/*.test.mjs" "integrations/herdr-app/pi-foreman-plan/*.test.mjs"
      - name: installer tests (dry-run, idempotent second run, remove)
        if: matrix.shard == '1/3'
        run: node --import ./tests/installer/_hermetic-env.mjs --test "tests/installer/*.test.mjs"
      - name: adapter tests (one Windows shard)
        if: matrix.shard != '1/3'
        run: node --import ./extensions/core-adapter/test/_hermetic-env.mjs --test --test-shard=${{ matrix.adapter-shard }} "extensions/core-adapter/test/*.test.ts"
      - name: ledger shims on Windows (cmd and PowerShell)
        if: matrix.shard == '1/3'
        shell: pwsh
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'shim-proj'
          New-Item -ItemType Directory -Force (Join-Path $proj '.workflow') | Out-Null
          $led = Join-Path $proj '.workflow\LEDGER-shim.md'
          Set-Content -Path $led -Value "# LEDGER`n`n- [ ] 1. one`n- [ ] V. fresh-eyes verification passed"
          function Check($name, $out, $code) {
            $text = $out -join "`n"
            if ($code -ne 0 -or $text -notmatch '2 open item') { throw "$name failed (exit $code): $text" }
            Write-Output "$name ok"
          }
          $env:PI_FOREMAN_PYTHON = (Get-Command python).Source
          $out = cmd /c "bin\ledger.cmd -f `"$led`" status"; Check 'ledger.cmd' $out $LASTEXITCODE
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File bin\ledger.ps1 -f $led status; Check 'ledger.ps1 (powershell, Bypass)' $out $LASTEXITCODE
          $out = pwsh -NoProfile -ExecutionPolicy Bypass -File bin\ledger.ps1 -f $led status; Check 'ledger.ps1 (pwsh, Bypass)' $out $LASTEXITCODE
          $out = pwsh -NoProfile -File bin\ledger.ps1 -f $led status 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Output "ledger.ps1 without Bypass: blocked (exit $LASTEXITCODE); ledger.cmd is the fallback" } else { Write-Output "ledger.ps1 without Bypass: runs under the runner's default policy" }
          Remove-Item Env:PI_FOREMAN_PYTHON
          $out = cmd /c "bin\ledger.cmd -f `"$led`" status"; Check 'ledger.cmd (py launcher fallback)' $out $LASTEXITCODE
  replay:
    # The macOS leg runs on push to main only: on pull_request the matrix is built without it (GitHub has too few free macOS runners; a macOS-only replay fault is then found after the merge).
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"ubuntu-latest","shard":1,"shards":2,"node":"22"},{"os":"ubuntu-latest","shard":2,"shards":2,"node":"22"},{"os":"windows-latest","shard":1,"shards":4,"node":"22"},{"os":"windows-latest","shard":2,"shards":4,"node":"22"},{"os":"windows-latest","shard":3,"shards":4,"node":"22"},{"os":"windows-latest","shard":4,"shards":4,"node":"22"},{"os":"ubuntu-latest","shard":1,"shards":2,"node":"26"},{"os":"ubuntu-latest","shard":2,"shards":2,"node":"26"}]}' || '{"include":[{"os":"ubuntu-latest","shard":1,"shards":2,"node":"22"},{"os":"ubuntu-latest","shard":2,"shards":2,"node":"22"},{"os":"macos-latest","shard":1,"shards":1,"node":"22"},{"os":"windows-latest","shard":1,"shards":4,"node":"22"},{"os":"windows-latest","shard":2,"shards":4,"node":"22"},{"os":"windows-latest","shard":3,"shards":4,"node":"22"},{"os":"windows-latest","shard":4,"shards":4,"node":"22"},{"os":"ubuntu-latest","shard":1,"shards":2,"node":"26"},{"os":"ubuntu-latest","shard":2,"shards":2,"node":"26"}]}') }}
    name: replay (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }}${{ matrix.node != '22' && format(', node {0}', matrix.node) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: "Windows: Defender real-time scanning off (CI speed)"
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: install bundled packages (pi-subagents, intercom, Pi 1.7.0 from the lockfile)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: replay scenarios (fake provider only, no secrets), one shard
        env:
          FOREMAN_PI_CLI: ${{ github.workspace }}/node_modules/@earendil-works/pi-coding-agent/dist/bundle/cli.js
          FOREMAN_REPLAY_REQUIRED: "1"
          FOREMAN_REPLAY_JOBS: ${{ runner.os == 'Windows' && '2' || '' }}
        run: node scripts/replay_run.mjs --shard ${{ matrix.shard }}/${{ matrix.shards }}
  bench-smoke:
    # Harbor needs Linux Docker, so the real rig run is Linux only (macOS and Windows run the
    # foreman bench unit tests in the test job). Fake provider only; no secrets; telemetry off.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HARBOR_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: install Harbor (uv tool, Python 3.12)
        run: |
          python -m pip install -q -r .github/bench-requirements.txt
          uv tool install --python 3.12 "harbor==0.23.0"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
          "$(uv tool dir --bin)/harbor" --version
      - name: foreman bench smoke (ForemanPi, fake provider, detach probe)
        run: python scripts/foreman_bench.py run --preset bench/presets/smoke.json --rows foreman-fake --task detach-probe --jobs-dir "$RUNNER_TEMP/bench-jobs"
      - name: assert reward 1 and the detached child finished before the verifier
        run: |
          python scripts/foreman_bench.py table --preset bench/presets/smoke.json --jobs-dir "$RUNNER_TEMP/bench-jobs"
          BENCH_RESULT="$(node scripts/foreman_ci_bench.mjs "$RUNNER_TEMP/bench-jobs")"
          export BENCH_RESULT
          python - <<'EOF'
          import json, os
          from datetime import datetime
          r = json.load(open(os.environ["BENCH_RESULT"]))
          assert r["verifier_result"]["rewards"]["reward"] == 1.0, r.get("exception_info")
          b = r["agent_result"]["metadata"]["bench"]
          runs = b["async_runs_at_end"]
          assert runs and all(x["state"] == "complete" for x in runs), runs
          v = datetime.fromisoformat(r["verifier"]["started_at"].replace("Z", "+00:00")).timestamp() * 1000
          assert all(x["lastUpdate"] < v for x in runs), (runs, v)
          assert b["claude_config_dir"]["empty"], b["claude_config_dir"]
          print("bench smoke ok: child finished %d ms before the verifier; tokens %s" % (v - max(x["lastUpdate"] for x in runs), b["counters"]["tokens"]["total"]))
          EOF
      - name: revision probe (triage, builder, denied ask, failing review, revision) on the fake provider
        run: |
          python scripts/foreman_bench.py run --preset bench/presets/smoke.json --rows foreman-fake-revision --task revision-probe --jobs-dir "$RUNNER_TEMP/bench-jobs"
          python - <<'EOF'
          import glob, json, os
          base = os.path.join(os.environ["RUNNER_TEMP"], "bench-jobs", "foreman-fake-revision__revision-probe__r1__*")
          logs = glob.glob(os.path.join(base, "*", "agent"))
          assert logs, base
          logs = logs[-1]
          r = json.load(open(glob.glob(os.path.join(os.path.dirname(logs), "result.json"))[-1]))
          b = r["agent_result"]["metadata"]["bench"]
          assert b["status"] == "done" and not b["infra_error"], b
          run = json.load(open(os.path.join(logs, "bench-run.json")))
          assert "pi-subagents" in run["versions"], run["versions"]
          cfg = json.load(open(os.path.join(logs, "agent-foreman.json")))
          assert cfg["providers"]["foreman-fake"]["review"]["model"], cfg
          assert glob.glob(os.path.join(logs, "state", "usage", "*.jsonl")), os.listdir(os.path.join(logs, "state"))
          assert len(run["asks_denied"]) >= 1, run
          events = [json.loads(l) for f in glob.glob(os.path.join(logs, "trace", "trace-*.jsonl")) for l in open(f)]
          assert any(e.get("event") == "triage" and e.get("decision") == "recorded" for e in events), "no triage event"
          print("revision probe ok: asks_denied %s, %d trace events" % (run["asks_denied"], len(events)))
          EOF
      - name: M1 re-check hidden check on the fake provider (scripted good run 1, no-reviewer run 0)
        run: |
          python scripts/foreman_bench.py run --preset bench/presets/smoke.json --rows m1-fake-good m1-fake-bad --task m1-recheck --jobs-dir "$RUNNER_TEMP/bench-jobs"
          python scripts/foreman_bench.py table --preset bench/presets/smoke.json --jobs-dir "$RUNNER_TEMP/bench-jobs" --json > "$RUNNER_TEMP/m1.json"
          python -c "import json,sys; c={(r['row'],r['task']):r for r in json.load(open(sys.argv[1]))['cells']}; g=c[('m1-fake-good','m1-recheck')]; b=c[('m1-fake-bad','m1-recheck')]; assert (g['counted'],g['success'],b['counted'],b['success'])==(1,1,1,0), (g,b); print('m1 re-check check ok: good 1, bad 0')" "$RUNNER_TEMP/m1.json"
      - name: upload bench-smoke outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-smoke-jobs
          path: ${{ runner.temp }}/bench-jobs
          if-no-files-found: ignore
          retention-days: 7
  fresh-install:
    # A new user's install: plain `npm ci` in a clone, then the managed form (`pi install git:` runs `npm install --omit=dev --legacy-peer-deps`).
    # npm 11.9 to 11.12 refuses the forked git dependency pi-intercom (EALLOWGIT); that cell must fail, with the engines warning first.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, npm: bundled}
          - {os: windows-latest, npm: bundled}
          - {os: ubuntu-latest, npm: "11.13.0"}
          - {os: ubuntu-latest, npm: "11.12.1", expect-fail: true}
    name: fresh-install (${{ matrix.os }}, npm ${{ matrix.npm }}${{ matrix.expect-fail && ', expected to fail' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      NPM_CMD: ${{ matrix.npm == 'bundled' && 'npm' || format('npx -y npm@{0}', matrix.npm) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: npm ci fails with EBADENGINE and EALLOWGIT (npm 11.12.1)
        if: matrix.expect-fail
        shell: bash
        run: |
          if $NPM_CMD ci > out.txt 2>&1; then
            cat out.txt
            echo "expected npm ci to fail"
            exit 1
          fi
          cat out.txt
          grep -q EBADENGINE out.txt
          grep -q EALLOWGIT out.txt
      - name: npm ci
        if: ${{ !matrix.expect-fail }}
        shell: bash
        run: |
          $NPM_CMD --version
          $NPM_CMD ci
          test -f node_modules/pi-intercom/package.json
          test -f node_modules/@juicesharp/rpiv-ask-user-question/package.json
      - name: managed install in a fresh clone
        if: ${{ !matrix.expect-fail }}
        shell: bash
        run: |
          git clone . "$RUNNER_TEMP/managed"
          cd "$RUNNER_TEMP/managed"
          $NPM_CMD install --omit=dev --legacy-peer-deps
          test -f node_modules/pi-intercom/package.json
          test -f node_modules/@juicesharp/rpiv-ask-user-question/package.json
  fresh-install-advisory:
    # Advisory (not in ci-ok): the newest npm, so a new npm release cannot block all work. macOS (bundled npm) runs here on push to main only, never on pull_request (GitHub has too few free macOS runners); it never blocks merging.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"ubuntu-latest","npm":"latest"},{"os":"windows-latest","npm":"latest"}]}' || '{"include":[{"os":"ubuntu-latest","npm":"latest"},{"os":"windows-latest","npm":"latest"},{"os":"macos-latest","npm":"bundled"}]}') }}
    name: fresh-install-advisory (${{ matrix.os }}, npm ${{ matrix.npm }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      NPM_CMD: ${{ matrix.npm == 'bundled' && 'npm' || format('npx -y npm@{0}', matrix.npm) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: npm ci
        shell: bash
        run: |
          $NPM_CMD --version
          $NPM_CMD ci
          test -f node_modules/pi-intercom/package.json
          test -f node_modules/@juicesharp/rpiv-ask-user-question/package.json
      - name: managed install in a fresh clone
        shell: bash
        run: |
          git clone . "$RUNNER_TEMP/managed"
          cd "$RUNNER_TEMP/managed"
          $NPM_CMD install --omit=dev --legacy-peer-deps
          test -f node_modules/pi-intercom/package.json
          test -f node_modules/@juicesharp/rpiv-ask-user-question/package.json
  review-gates-model:
    # The TLA+ models of the review gates (.agents/skills/verifying-review-gates/model) and of the permission flow (.agents/skills/verifying-permission-gate/model), Linux only: Java 25 and a pinned tla2tools.jar live in this job and nowhere else (not in package.json, setup, install or the macOS and Windows legs).
    # The model can drift from the code; the TypeScript walk in the test job is the main check. The covered files are listed in the log as a drift hint.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TLA_VERSION: v1.7.4
      # SHA-256 of tla2tools.jar from https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar, the latest stable (non-pre-release) release (computed from the file downloaded on 2026-11-23); a different file fails the job
      TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
      - name: files the model covers (update the model when one of them changes)
        run: |
          printf '%s\n' extensions/core-adapter/reviewgates.ts extensions/core-adapter/bound.ts extensions/core-adapter/ledgercall.ts extensions/core-adapter/childblocked.ts
          echo "model: .agents/skills/verifying-review-gates/model/ReviewGates.tla"
          printf '%s\n' extensions/core-adapter/childask.ts extensions/core-adapter/childaskpark.ts extensions/core-adapter/gatedialog.ts extensions/core-adapter/presencewait.ts extensions/core-adapter/index.ts
          echo "model: .agents/skills/verifying-permission-gate/model/PermissionFlow.tla"
      - name: download tla2tools.jar and check its SHA-256
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tla2tools.jar" "https://github.com/tlaplus/tlaplus/releases/download/${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_SHA256}  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
      - name: TLC (same config as the local command)
        working-directory: .agents/skills/verifying-review-gates/model
        run: |
          java -version
          java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -config ReviewGates.cfg -workers auto -metadir "$RUNNER_TEMP/tlc-states" ReviewGates.tla
      - name: TLC permission flow (same config as the local command)
        working-directory: .agents/skills/verifying-permission-gate/model
        run: |
          java -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC -config PermissionFlow.cfg -workers auto -metadir "$RUNNER_TEMP/tlc-states-permission" PermissionFlow.tla
  ci-ok:
    # The one required check: passes only when every job it needs succeeded (a skipped or cancelled job fails it). A matrix job's result is the aggregate of its legs, so a failed, cancelled or skipped Windows shard fails ci-ok too.
    needs: [test, test-windows, replay, bench-smoke, fresh-install, review-gates-model]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e "const n = JSON.parse(process.env.NEEDS); const bad = Object.entries(n).filter(([, v]) => v.result !== 'success'); for (const [job, v] of bad) console.error(job + ': ' + v.result); process.exit(bad.length ? 1 : 0)"
