name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: python unit tests
        run: python -m unittest discover -s tests -v
      - name: core pin check
        run: python scripts/pull_core.py --check
      - name: core conformance (upstream tests at the pinned sha, summary only)
        run: |
          python -m pip install -q pytest
          python scripts/pull_core.py --conformance
      - name: adapter tests
        run: node --test "extensions/core-adapter/test/*.test.ts"
      - name: installer tests (dry-run, idempotent second run, remove)
        run: node --test "tests/installer/*.test.mjs"
      - name: install Pi (pinned)
        run: npm install -g @earendil-works/pi-coding-agent@1.0.0
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pi-foreman-replay-cache
          key: pi-subagents-0.75.0-${{ runner.os }}
      - name: replay scenarios (fake provider only, no secrets)
        env:
          FOREMAN_REPLAY_REQUIRED: "1"
          FOREMAN_REPLAY_CACHE: ${{ runner.temp }}/pi-foreman-replay-cache
        run: python -m unittest discover -s tests/replay -v
      - name: ledger shims on Windows (cmd and PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proj = Join-Path $env:RUNNER_TEMP 'shim-proj'
          New-Item -ItemType Directory -Force (Join-Path $proj '.workflow') | Out-Null
          $led = Join-Path $proj '.workflow\LEDGER-shim.md'
          Set-Content -Path $led -Value "# LEDGER`n`n- [ ] 1. one`n- [ ] V. fresh-eyes verification passed"
          function Check($name, $out, $code) {
            $text = $out -join "`n"
            if ($code -ne 0 -or $text -notmatch '2 open item') { throw "$name failed (exit $code): $text" }
            Write-Output "$name ok"
          }
          $env:PI_FOREMAN_PYTHON = (Get-Command python).Source
          $out = cmd /c "bin\ledger.cmd -f `"$led`" status"; Check 'ledger.cmd' $out $LASTEXITCODE
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File bin\ledger.ps1 -f $led status; Check 'ledger.ps1 (powershell, Bypass)' $out $LASTEXITCODE
          $out = pwsh -NoProfile -ExecutionPolicy Bypass -File bin\ledger.ps1 -f $led status; Check 'ledger.ps1 (pwsh, Bypass)' $out $LASTEXITCODE
          $out = pwsh -NoProfile -File bin\ledger.ps1 -f $led status 2>&1
          if ($LASTEXITCODE -ne 0) { Write-Output "ledger.ps1 without Bypass: blocked (exit $LASTEXITCODE); ledger.cmd is the fallback" } else { Write-Output "ledger.ps1 without Bypass: runs under the runner's default policy" }
          Remove-Item Env:PI_FOREMAN_PYTHON
          $out = cmd /c "bin\ledger.cmd -f `"$led`" status"; Check 'ledger.cmd (py launcher fallback)' $out $LASTEXITCODE
  bench-smoke:
    # Harbor needs Linux Docker, so the real rig run is Linux only (macOS and Windows run the
    # foreman bench unit tests in the test job). Fake provider only; no secrets; telemetry off.
    runs-on: ubuntu-latest
    env:
      HARBOR_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install Harbor (uv tool, Python 3.12)
        run: |
          python -m pip install -q uv
          uv tool install --python 3.12 "harbor==0.23.0"
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"
          "$(uv tool dir --bin)/harbor" --version
      - name: foreman bench smoke (ForemanPi, fake provider, detach probe)
        run: python scripts/foreman_bench.py run --preset bench/presets/smoke.json --rows foreman-fake --task detach-probe --jobs-dir "$RUNNER_TEMP/bench-jobs"
      - name: assert reward 1 and the detached child finished before the verifier
        run: |
          python scripts/foreman_bench.py table --preset bench/presets/smoke.json --jobs-dir "$RUNNER_TEMP/bench-jobs"
          python - <<'EOF'
          import glob, json, os
          from datetime import datetime
          files = [f for f in glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "bench-jobs", "foreman-fake__detach-probe__r1__*", "*", "result.json"))]
          r = [json.load(open(f)) for f in files if "trial_name" in json.load(open(f))][-1]
          assert r["verifier_result"]["rewards"]["reward"] == 1.0, r.get("exception_info")
          b = r["agent_result"]["metadata"]["bench"]
          runs = b["async_runs_at_end"]
          assert runs and all(x["state"] == "complete" for x in runs), runs
          v = datetime.fromisoformat(r["verifier"]["started_at"].replace("Z", "+00:00")).timestamp() * 1000
          assert all(x["lastUpdate"] < v for x in runs), (runs, v)
          assert b["claude_config_dir"]["empty"], b["claude_config_dir"]
          print("bench smoke ok: child finished %d ms before the verifier; tokens %s" % (v - max(x["lastUpdate"] for x in runs), b["counters"]["tokens"]["total"]))
          EOF
      - name: M1 re-check hidden check on the fake provider (scripted good run 1, no-reviewer run 0)
        run: |
          python scripts/foreman_bench.py run --preset bench/presets/smoke.json --rows m1-fake-good m1-fake-bad --task m1-recheck --jobs-dir "$RUNNER_TEMP/bench-jobs"
          python scripts/foreman_bench.py table --preset bench/presets/smoke.json --jobs-dir "$RUNNER_TEMP/bench-jobs" --json > "$RUNNER_TEMP/m1.json"
          python -c "import json,sys; c={(r['row'],r['task']):r for r in json.load(open(sys.argv[1]))['cells']}; g=c[('m1-fake-good','m1-recheck')]; b=c[('m1-fake-bad','m1-recheck')]; assert (g['counted'],g['success'],b['counted'],b['success'])==(1,1,1,0), (g,b); print('m1 re-check check ok: good 1, bad 0')" "$RUNNER_TEMP/m1.json"
